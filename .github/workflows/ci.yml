name: CI

# Runs on every pull request and on pushes to main. Read-only: no secrets, no deploys, no publishing.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (typecheck, tests, licenses)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Dependency licenses (production)
        run: pnpm licenses list --prod --json | node scripts/check-licenses.mjs
      # Boots the real API on TESTNET settings (zero address as payTo; nothing is ever paid) and
      # checks it over HTTP: contract routes, Problem Details, and that unpaid paid-route calls
      # still get a 402. Needs the public GoPlausible testnet facilitator for the 402 checks.
      - name: HTTP smoke test (testnet config, unpaid)
        env:
          NETWORK: testnet
          AVM_ADDRESS: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAY5HFKQ
          PORT: '4021'
          MONITOR_TARGETS: ''
          OBSERVATION_LOG: ${{ runner.temp }}/smoke/observations.jsonl
        run: |
          pnpm start > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4021/health > /dev/null && break; sleep 1; done
          node scripts/smoke-free-routes.mjs http://localhost:4021 || { echo '--- server log ---'; cat "$RUNNER_TEMP/server.log"; exit 1; }
      # With a signing key that is NOT published in attest/jwks-history.json, the API must refuse to
      # start rather than issue signatures nobody can verify.
      - name: Refuses to start with an unpublished signing key
        env:
          NETWORK: testnet
          AVM_ADDRESS: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAY5HFKQ
          PORT: '4031'
          MONITOR_TARGETS: ''
          OBSERVATION_LOG: ${{ runner.temp }}/smoke2/observations.jsonl
        run: |
          node_modules/.bin/tsx scripts/attest-keygen.ts "$RUNNER_TEMP/unpublished/signing.pem" > /dev/null
          set +e
          SIGNING_KEY_PATH="$RUNNER_TEMP/unpublished/signing.pem" timeout 60 pnpm start > "$RUNNER_TEMP/refuse.log" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/refuse.log"
          test "$code" -ne 0 && test "$code" -ne 124 || { echo "expected a startup failure, got exit $code"; exit 1; }
          grep -q 'not published as "active"' "$RUNNER_TEMP/refuse.log"
          ! grep -q 'BEGIN PRIVATE KEY' "$RUNNER_TEMP/refuse.log"

  sdk:
    name: hosannaith-client (typecheck, licenses)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Dependency licenses (production)
        run: pnpm licenses list --prod --json | node ../../scripts/check-licenses.mjs

  mcp:
    name: hosannaith-mcp (build, licenses)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # hosannaith-mcp has no committed lockfile yet, so CI resolves fresh within package.json ranges.
      - run: pnpm install --ignore-workspace --no-frozen-lockfile
      - run: pnpm run build
      - name: Dependency licenses (production)
        run: pnpm licenses list --prod --json --ignore-workspace | node ../scripts/check-licenses.mjs

  # Rehearses the release workflow's build job for both packages: license and dependency data,
  # SBOM, and the exact tarball, which must carry the license files and no tests, and must repack
  # to the same file list once extracted (the release stages the extracted tarball).
  packages:
    name: npm packages (dry run, SBOM)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: sdk/typescript
            install: pnpm install --frozen-lockfile
            pnpmflags: ''
          - dir: mcp
            install: pnpm install --ignore-workspace --no-frozen-lockfile
            pnpmflags: --ignore-workspace
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and build
        working-directory: ${{ matrix.dir }}
        run: |
          ${{ matrix.install }}
          pnpm run --if-present build
          pnpm licenses list --prod --json ${{ matrix.pnpmflags }} > "$RUNNER_TEMP/licenses.json"
          pnpm list --prod --depth Infinity --json ${{ matrix.pnpmflags }} > "$RUNNER_TEMP/list.json"
      - name: SBOM (CycloneDX)
        run: |
          node scripts/sbom.mjs --package "${{ matrix.dir }}/package.json" \
            --list "$RUNNER_TEMP/list.json" --licenses "$RUNNER_TEMP/licenses.json" > "$RUNNER_TEMP/sbom.cdx.json"
      - name: Tarball contents
        working-directory: ${{ matrix.dir }}
        run: |
          mkdir -p "$RUNNER_TEMP/out" "$RUNNER_TEMP/pkg"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/out" --json > "$RUNNER_TEMP/pack.json"
          tarball=$(node -p 'require(process.argv[1])[0].filename' "$RUNNER_TEMP/pack.json")
          tar -xzf "$RUNNER_TEMP/out/$tarball" -C "$RUNNER_TEMP/pkg" --strip-components=1
          (cd "$RUNNER_TEMP/pkg" && npm pack --dry-run --ignore-scripts --json > "$RUNNER_TEMP/repack.json")
          node -e '
            const list = (f) => require(f)[0].files.map((x) => x.path).sort();
            const files = list(process.argv[1]), again = list(process.argv[2]);
            console.log(files.join("\n"));
            for (const f of ["LICENSE", "NOTICE", "package.json", "README.md"]) if (!files.includes(f)) throw new Error("missing " + f);
            if (files.some((f) => f.startsWith("test/") || f.endsWith(".test.ts"))) throw new Error("tests would be published");
            if (JSON.stringify(files) !== JSON.stringify(again)) throw new Error("the extracted tarball repacks differently");
          ' "$RUNNER_TEMP/pack.json" "$RUNNER_TEMP/repack.json"
